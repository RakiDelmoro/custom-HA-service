[package]
name = "custom-ha-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "custom_ha_service"
path = "src/lib.rs"

[[bin]]
name = "custom-ha-service"
path = "src/main.rs"

[dependencies]
rumqttc = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
simple_logger = "4.3"

[dev-dependencies]
tokio-test = "0.4"
